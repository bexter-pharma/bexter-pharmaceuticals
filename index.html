<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f5b"><title>Bexter Pharmaceuticals</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"></head><body><header><div><h1>Bexter Pharmaceuticals</h1><p>Order Management System</p></div><button id="logoutBtn" class="hidden secondary">Logout</button></header><main><div id="setupNotice" class="notice hidden"></div><section id="loginView" class="login"><h2>Admin / Staff Login</h2><form id="loginForm"><input id="email" type="email" placeholder="Email address" required autocomplete="username"><input id="password" type="password" placeholder="Password" required autocomplete="current-password"><p id="loginMessage" class="message"></p><button type="submit" class="wide">Login</button></form></section><section id="dashboardView" class="hidden"><div class="welcome"><div><h2>Welcome, <span id="adminName">User</span></h2><p id="roleName"></p></div><span class="pill">BEXTER OMS</span></div><nav id="tabs"><button data-tab="overview" class="active">Dashboard</button><button data-tab="orders">Orders</button><button data-tab="neworder">New Order</button><button data-tab="products">Products</button><button data-tab="inventory">Inventory</button><button data-tab="approvals">Approvals</button><button data-tab="reports">Reports</button></nav><div id="appMessage" class="message"></div><section id="tab-overview" class="panel"><h3>Dashboard Overview</h3><div class="stats" id="stats"></div><h3>Recent Orders</h3><div id="recentOrders"></div></section><section id="tab-orders" class="panel hidden"><div class="panelhead"><h3>All Orders</h3><button id="refreshOrders" class="small">Refresh</button></div><div id="ordersTable"></div></section><section id="tab-neworder" class="panel hidden"><h3>Create New Order</h3><form id="orderForm"><label>Products</label><div id="orderLines"></div><button type="button" id="addLine" class="secondary small">+ Add Product</button><label>Remarks</label><textarea id="orderRemarks" rows="3" placeholder="Optional remarks"></textarea><div id="orderTotal" class="total">Total: ৳0.00</div><button type="submit">Submit Order</button></form></section><section id="tab-products" class="panel hidden"><h3>Product Management</h3><form id="productForm" class="formgrid"><input id="pcode" placeholder="Product code" required><input id="pname" placeholder="Product name" required><input id="pstrength" placeholder="Strength"><input id="pform" placeholder="Dosage form"><input id="ppack" placeholder="Pack size"><input id="pprice" type="number" min="0" step="0.01" placeholder="Unit price (৳)" required><button type="submit">Add Product</button></form><div id="productsTable"></div></section><section id="tab-inventory" class="panel hidden"><h3>Inventory</h3><div id="inventoryTable"></div></section><section id="tab-approvals" class="panel hidden"><h3>Pending Approvals</h3><div id="approvalsTable"></div></section><section id="tab-reports" class="panel hidden"><h3>Reports</h3><div id="reportSummary"></div><button id="exportCsv" class="secondary">Download Orders CSV</button></section></section></main><script src="./config.js"></script><script type="module" src="./app.js"></script></body></html>
